name: Bug report
description: Report a reproducible problem with the put.io browser extension.
title: ""
labels:
  - bug
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Exact steps, including the page and the link or media you right-clicked.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser and version, extension version, and whether it was installed from the store or loaded unpacked.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots or console output. Do not include put.io tokens or account credentials.
